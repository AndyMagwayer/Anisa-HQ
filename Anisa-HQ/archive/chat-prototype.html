<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Аниса</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f4f1;--card:#fff;--tx:#1d1b19;--mut:#7a746c;--ac:#a23b72;--bd:#e4dfd8;--me:#efe3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131a;--card:#201d27;--tx:#efeaf2;--mut:#9a93a6;--ac:#e07bb0;--bd:#33303c;--me:#3a2a3a}}
:root[data-theme="dark"]{--bg:#15131a;--card:#201d27;--tx:#efeaf2;--mut:#9a93a6;--ac:#e07bb0;--bd:#33303c;--me:#3a2a3a}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:700}
header b{display:block}header small{color:var(--mut)}
main{flex:1;display:flex;min-height:0}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:80%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;background:var(--card);border:1px solid var(--bd)}
.m.me{align-self:flex-end;background:var(--me)}
.draft{align-self:flex-start;max-width:80%;border:1px dashed var(--ac);border-radius:14px;padding:10px 13px;background:var(--card)}
.draft small{color:var(--mut);display:block;margin-bottom:4px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;margin-top:8px}
aside{width:250px;border-left:1px solid var(--bd);background:var(--card);padding:14px;overflow-y:auto}
aside h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;color:var(--mut);letter-spacing:.05em}
aside ul{margin:0 0 16px;padding-left:16px}aside li{margin-bottom:4px}
.done{text-decoration:line-through;color:var(--mut)}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--bd);background:var(--card)}
input{flex:1;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
@media(max-width:700px){aside{display:none}.m,.draft{max-width:92%}}
</style>
</head>
<body>
<header><div class="av">А</div><div><b>Аниса</b><small>личный ассистент · критичные действия только с Вашего подтверждения</small></div></header>
<main>
<div id="chat"></div>
<aside><h4>Задачи</h4><ul id="tasks"></ul><h4>Память</h4><ul id="mem"></ul></aside>
</main>
<form id="f"><input id="in" placeholder="Напишите Анисе…" autocomplete="off"><button class="p">Отправить</button></form>
<script>
const $=id=>document.getElementById(id);
let S={tasks:[],mem:[],n:1};
try{const r=localStorage.getItem("anisa");if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem("anisa",JSON.stringify(S))}catch(e){}};
const turns=[];let sample=null,busy=false;

function add(cls,text){const d=document.createElement("div");d.className="m "+cls;d.textContent=text;$("chat").appendChild(d);$("chat").scrollTop=1e9;return d}
function side(){
  $("tasks").innerHTML="";$("mem").innerHTML="";
  S.tasks.forEach(t=>{const li=document.createElement("li");li.textContent="#"+t.id+" "+t.title+(t.due?" ("+t.due+")":"");if(t.done)li.className="done";$("tasks").appendChild(li)});
  S.mem.forEach(m=>{const li=document.createElement("li");li.textContent=m;$("mem").appendChild(li)});
  if(!S.tasks.length)$("tasks").innerHTML="<li style='list-style:none;color:var(--mut)'>пока пусто</li>";
  if(!S.mem.length)$("mem").innerHTML="<li style='list-style:none;color:var(--mut)'>пока пусто</li>";
}
function draft(to,text){
  const d=document.createElement("div");d.className="draft";
  const s=document.createElement("small");s.textContent="Черновик для Telegram → "+to;
  const p=document.createElement("div");p.textContent=text;p.style.whiteSpace="pre-wrap";
  const r=document.createElement("div");r.className="row";
  const ok=document.createElement("button");ok.className="p";ok.textContent="Подтвердить";
  const no=document.createElement("button");no.textContent="Отмена";
  ok.onclick=()=>{r.textContent="Подтверждено. Telegram пока не подключён, поэтому сообщение не отправлено (это тест подтверждения).";};
  no.onclick=()=>{r.textContent="Отменено.";};
  r.append(ok,no);d.append(s,p,r);$("chat").appendChild(d);$("chat").scrollTop=1e9;
}
const tools=[
 {name:"add_task",description:"Создать задачу или напоминание",inputSchema:{type:"object",properties:{title:{type:"string"},due:{type:"string",description:"срок, например 'завтра 10:00'"}},required:["title"]},execute:i=>{const t={id:S.n++,title:i.title,due:i.due||"",done:false};S.tasks.push(t);save();side();return {ok:true,id:t.id}}},
 {name:"list_tasks",description:"Показать все задачи",inputSchema:{type:"object",properties:{}},execute:()=>S.tasks},
 {name:"complete_task",description:"Отметить задачу выполненной",inputSchema:{type:"object",properties:{id:{type:"number"}},required:["id"]},execute:i=>{const t=S.tasks.find(x=>x.id===i.id);if(!t)return {ok:false};t.done=true;save();side();return {ok:true}}},
 {name:"remember",description:"Запомнить важный факт о пользователе, проекте или договорённости",inputSchema:{type:"object",properties:{fact:{type:"string"}},required:["fact"]},execute:i=>{S.mem.push(i.fact);save();side();return {ok:true}}},
 {name:"draft_telegram",description:"Подготовить черновик Telegram-сообщения. НИКОГДА не отправляется сам: пользователь должен нажать «Подтвердить».",inputSchema:{type:"object",properties:{to:{type:"string"},text:{type:"string"}},required:["to","text"]},execute:i=>{draft(i.to,i.text);return {ok:true,status:"показано пользователю, ждёт подтверждения"}}}
];
function brief(){
  return "Ты — Аниса, личный AI-ассистент. Женская личность, уважительно, всегда обращаешься к пользователю на «Вы». Отвечаешь на языке пользователя (русский, узбекский или английский), кратко и по делу. Если команда неоднозначна, задай один уточняющий вопрос. Используй инструменты для задач, памяти и черновиков. Сообщения в Telegram ты НЕ отправляешь сама, только готовишь черновик через draft_telegram и ждёшь подтверждения. Ты не знаешь реальных данных о календаре, почте и Telegram, пока они не подключены: не выдумывай их, честно скажи, что этот источник пока не подключён.\n\nТекущие задачи: "+JSON.stringify(S.tasks)+"\nПамять: "+JSON.stringify(S.mem)+"\nСейчас: "+new Date().toLocaleString("ru-RU");
}
async function send(text){
  if(busy)return;busy=true;add("me",text);
  const out=add("","…");
  turns.push({role:"user",content:text});
  const input=turns.map((t,i)=>i===0?{role:"user",content:brief()+"\n\n---\nСообщение пользователя:\n"+t.content}:t);
  try{
    const r=await sample(input,{cache:false,tools,onText:({text})=>{out.textContent=text||"…"}});
    out.textContent=r.text||"Готово.";turns.push({role:"assistant",content:r.text||"Готово."});
  }catch(e){out.textContent=e&&e.code==="not_granted"?"Для ответов нужно разрешить доступ к Claude.":"Не получилось ответить ("+(e&&e.code||"ошибка")+"). Попробуйте ещё раз.";turns.pop()}
  busy=false;$("chat").scrollTop=1e9;
}
$("f").onsubmit=e=>{e.preventDefault();const v=$("in").value.trim();if(!v)return;$("in").value="";if(!sample){add("","Подключаюсь к мозгу… попробуйте через секунду.");return}send(v)};
side();
add("","Здравствуйте! Я Аниса. Могу вести Ваши задачи и напоминания, запоминать важное и готовить ответы для Telegram с подтверждением перед отправкой. Чем помочь?");
(async()=>{try{sample=await claude.use("sample")}catch(e){}if(!sample)add("","Не удалось подключиться к Claude в этом окне.")})();
</script>
</body>
</html>
